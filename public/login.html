<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Scheduler — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #f6f1e8;
      --surface:       #fffdf9;
      --surface-muted: #f3ece1;
      --border:        #e5dccd;
      --border-strong: #d3c7b5;
      --accent:        #3f342b;
      --accent-dim:    #2f2721;
      --accent-soft:   #efe4d5;
      --danger:        #a94432;
      --danger-soft:   #fbebe6;
      --success:       #3f7a58;
      --success-soft:  #eaf4ee;
      --warning:       #a4641f;
      --warning-soft:  #fcf0dd;
      --text:          #2e2822;
      --muted:         #7d7265;
      --focus-ring:    rgba(63, 52, 43, 0.14);
      --shadow:        0 1px 2px rgba(74, 58, 42, 0.06);
      --header-bg:     #eadbc8;
      --header-border: #d8c4ab;
      --mono:          'IBM Plex Mono', monospace;
      --sans:          'IBM Plex Sans', sans-serif;
    }

    body {
      background: linear-gradient(180deg, #f9f5ee 0%, #f3ecdf 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box, .box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 36px;
      width: 100%;
      max-width: 380px;
    }

    .box { max-width: 420px; }

    .logo {
      font-family: var(--sans);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
      text-align: center;
    }
    .logo span { color: var(--muted); font-weight: 400; }

    .subtitle {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      border-radius: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    input::placeholder { color: var(--muted); }

    .hint {
      margin-top: 5px;
      font-size: 11px;
      color: var(--muted);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #ffffff;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 12px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo">WA<span>/</span>Scheduler</div>
  <div class="subtitle">Acceso al panel</div>

  <div class="field">
    <label>Usuario</label>
    <input type="text" id="username" autocomplete="username" />
  </div>

  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" />
  </div>

  <button class="btn" id="loginBtn" onclick="doLogin()">Ingresar</button>

  <div class="error" id="errorMsg"></div>
</div>

<script>
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    errorMsg.textContent = '';

    if (!username || !password) {
      errorMsg.textContent = 'Completá todos los campos';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Ingresando...';

    try {
      const r = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const d = await r.json();

      if (d.ok) {
        window.location.href = '/';
      } else {
        errorMsg.textContent = 'Usuario o contraseña incorrectos';
      }
    } catch {
      errorMsg.textContent = 'Error al conectar con el servidor';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Ingresar';
    }
  }
</script>
</body>
</html>
