<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WA Scheduler</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #f6f7f9;
      --surface:       #ffffff;
      --surface-muted: #f9fafb;
      --border:        #e5e7eb;
      --border-strong: #d1d5db;
      --accent:        #111827;
      --accent-dim:    #1f2937;
      --accent-soft:   #eef2f7;
      --danger:        #b91c1c;
      --danger-soft:   #fef2f2;
      --success:       #047857;
      --success-soft:  #ecfdf5;
      --warning:       #b45309;
      --warning-soft:  #fffbeb;
      --text:          #111827;
      --muted:         #6b7280;
      --focus-ring:    rgba(17, 24, 39, 0.08);
      --shadow:        0 1px 2px rgba(16, 24, 40, 0.04);
      --header-bg:     #e9eef5;
      --header-border: #d8e0ea;
      --mono:          'IBM Plex Mono', monospace;
      --sans:          'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 0;
    }

    /* ── HEADER ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .logo span { color: var(--muted); font-weight: 400; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.online { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .status-dot.offline { background: var(--danger); }

    /* ── LAYOUT ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; padding: 16px; }
    }

    /* ── PANEL ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .panel-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-header .count {
      background: var(--border);
      color: var(--text);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0;
    }
    .panel-body { padding: 20px; }

    /* ── FORM ── */
    .field { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      border-radius: 0;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

    /* datetime-local fix */
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.4);
      cursor: pointer;
    }

    .hint {
      margin-top: 5px;
      font-size: 10px;
      color: var(--muted);
    }

    /* ── BUTTONS ── */
    .btn {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 20px;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.15s;
      border-radius: 0;
    }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      width: 100%;
    }
    .btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
      padding: 4px 10px;
      font-size: 10px;
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 12px 18px;
      max-width: 320px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
      border-left: 3px solid var(--accent);
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.error { border-left-color: var(--danger); }

    /* ── MESSAGE LIST ── */
    .msg-list { display: flex; flex-direction: column; gap: 1px; }

    .msg-item {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: start;
      transition: border-color 0.15s;
    }
    .msg-item:hover { border-color: var(--border-strong); }

    .msg-phone {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 3px;
    }
    .msg-text {
      font-size: 12px;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
      word-break: break-word;
      font-family: var(--sans);
    }
    .msg-meta {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .msg-id { color: #9ca3af; }

    .badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .badge-pending  { background: var(--warning-soft); color: var(--warning); border: 1px solid #fde68a; }
    .badge-sent     { background: var(--success-soft); color: var(--success); border: 1px solid #a7f3d0; }
    .badge-failed   { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca; }
    .badge-cancelled{ background: var(--surface-muted); color: var(--muted); border: 1px solid var(--border); }

    /* ── TABS ── */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }
    .tab {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 12px 16px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab:hover:not(.active) { color: var(--text); }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed var(--border);
    }
    .empty-icon { font-size: 24px; margin-bottom: 8px; }

    /* ── FULL WIDTH PANEL ── */
    .panel-full { grid-column: 1 / -1; }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    /* ── FILE INPUT ── */
  .file-input-wrapper {
    position: relative;
    border: 1px dashed var(--border);
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s;
    background: var(--bg);
  }
  .file-input-wrapper:hover { border-color: var(--accent); }
  .file-input-wrapper input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
    padding: 0;
    border: none;
  }
  .file-label {
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
    text-align: center;
}
  .file-label.selected { color: var(--text); }

  /* ── CONTACT SEARCH ── */
  .search-wrapper { position: relative; }
  .search-wrapper input { padding-right: 32px; }
  .search-clear {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 0;
    display: none;
  }
  .suggestions {
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-top: none;
    max-height: 200px;
    overflow-y: auto;
    z-index: 50;
    display: none;
  }
  .suggestions.open { display: block; }
  .suggestion-item {
    padding: 9px 12px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--border); }
  .suggestion-name { color: var(--text); }
  .suggestion-phone { color: var(--muted); font-size: 10px; }
  .suggestions-empty {
    padding: 10px 12px;
    font-size: 11px;
    color: var(--muted);
  }

    /* ── CHAR COUNTER ── */
  #charCount.warning { color: var(--warning); }
  #charCount.danger  { color: var(--danger); }

  .badge-retrying { background: var(--warning-soft); color: var(--warning); border: 1px solid #fde68a; }

    /* ── LIGHT THEME ── */
    header { background: var(--header-bg); border-bottom-color: var(--header-border); box-shadow: 0 1px 0 rgba(16, 24, 40, 0.03); }
    .logo { font-family: var(--sans); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; text-transform: none; color: var(--text); }
    .logo span { color: var(--muted); }
    .status-badge { font-family: var(--sans); font-size: 12px; letter-spacing: 0; color: #475569; background: rgba(255, 255, 255, 0.65); border: 1px solid rgba(17, 24, 39, 0.06); border-radius: 999px; padding: 6px 10px; }
    .status-dot.online { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
    .status-dot.offline { background: var(--danger); }
    main { max-width: 1080px; }
    .panel { border-radius: 10px; box-shadow: var(--shadow); }
    .panel-header { font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--text); padding: 16px 20px; background: var(--surface-muted); }
    .panel-header .count { background: var(--surface-muted); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
    label { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--text); }
    input, textarea { background: var(--surface); border-color: var(--border-strong); border-radius: 8px; font-family: var(--sans); font-size: 14px; }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus-ring); }
    input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: none; }
    .hint { font-family: var(--sans); font-size: 11px; }
    .btn { font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; border-radius: 8px; }
    .btn-primary { color: #ffffff; }
    .btn-danger { background: var(--danger-soft); border-color: #fecaca; color: var(--danger); border-radius: 6px; }
    .btn-danger:hover { background: var(--danger); border-color: var(--danger); color: #ffffff; }
    #toast { font-family: var(--sans); font-size: 12px; border-radius: 8px; box-shadow: 0 10px 30px rgba(16, 24, 40, 0.12); border-left-color: var(--success); }
    #toast.error { border-left-color: var(--danger); }
    .msg-list { gap: 8px; }
    .msg-item { background: var(--surface); border-radius: 8px; padding: 14px 16px; }
    .msg-item:hover { border-color: var(--border-strong); }
    .msg-phone { font-family: var(--mono); font-size: 12px; color: var(--text); }
    .msg-text { font-family: var(--sans); font-size: 14px; }
    .msg-meta { font-family: var(--sans); font-size: 11px; }
    .msg-id { color: #9ca3af; }
    .badge { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 0; text-transform: none; border-radius: 999px; padding: 2px 8px; }
    .badge-pending, .badge-retrying { background: var(--warning-soft); color: var(--warning); border-color: #fde68a; }
    .badge-sent { background: var(--success-soft); color: var(--success); border-color: #a7f3d0; }
    .badge-failed { background: var(--danger-soft); color: var(--danger); border-color: #fecaca; }
    .badge-cancelled { background: var(--surface-muted); color: var(--muted); border-color: var(--border); }
    .tabs { background: var(--surface-muted); }
    .tab { font-family: var(--sans); font-size: 13px; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .empty { background: var(--surface-muted); border-color: var(--border-strong); border-radius: 8px; font-family: var(--sans); font-size: 13px; }
    .loading { font-family: var(--sans); font-size: 12px; letter-spacing: 0; }
    .file-input-wrapper { background: var(--surface-muted); border-color: var(--border-strong); border-radius: 8px; }
    .file-input-wrapper:hover { border-color: var(--accent); }
    .file-label { font-family: var(--sans); font-size: 12px; }
    .file-label.selected { color: var(--text); }
    .suggestions { border-color: var(--border-strong); border-top: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 12px 32px rgba(16, 24, 40, 0.12); top: calc(100% + 4px); }
    .suggestion-item { font-family: var(--sans); font-size: 13px; }
    .suggestion-item:hover { background: var(--surface-muted); }
    .suggestion-name { color: var(--text); }
    .suggestion-phone { font-family: var(--mono); font-size: 11px; }
    .suggestions-empty { font-family: var(--sans); font-size: 12px; }
    #charCount.warning { color: var(--warning); }

    .load-more {
      width: 100%;
      margin-top: 4px;
      padding: 9px 12px;
      background: transparent;
      border: 1px dashed var(--border-strong);
      border-radius: 8px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .load-more:hover { background: var(--surface-muted); color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="logo">WA<span>/</span>Scheduler</div>
  <div class="status-badge">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">conectando...</span>
  </div>
</header>

<main>

  <!-- ── FORM PANEL ── -->
  <div class="panel">
    <div class="panel-header">Nuevo mensaje</div>
    <div class="panel-body">
      <form id="scheduleForm">

        <div class="field">
          <label>Destinatario</label>
          <div class="search-wrapper">
            <input
              type="text"
              id="contactSearch"
              placeholder="Buscar por nombre..."
              autocomplete="off"
            />
            <button type="button" class="search-clear" id="searchClear">✕</button>
            <div class="suggestions" id="suggestions"></div>
          </div>
          <input
            type="text"
            id="phone"
            placeholder="5491112345678"
            maxlength="15"
            autocomplete="off"
            style="margin-top: 6px;"
          />
          <div class="hint">Buscá por nombre o ingresá el número directamente</div>
          <div class="hint" id="phoneHint" style="color: var(--danger); display: none;">
            ⚠ El número debe incluir el prefijo internacional (ej: 549 para Argentina)
          </div>
        </div>

        <div class="field">
          <label>Mensaje</label>
          <textarea id="message" placeholder="Escribí el mensaje..." maxlength="4000"></textarea>
          <div class="hint" id="charCount">0 / 4000 caracteres</div>
        </div>

        <div class="field">
          <label>Fecha y hora de envío</label>
          <input type="datetime-local" id="scheduledAt" />
        </div>

        <div class="field">
          <label>Adjunto (opcional)</label>
          <div class="file-input-wrapper" id="fileWrapper">
            <input type="file" id="attachment" accept=".jpg,.jpeg,.png,.gif,.pdf,.docx,.xlsx,.doc,.xls" />
            <div class="file-label" id="fileLabel">Seleccionar imagen o documento...</div>
          </div>
          <div class="hint">JPG, PNG, GIF, PDF, DOCX, XLSX — máx. 16MB</div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
          Programar envío
        </button>

      </form>
    </div>
  </div>

  <!-- ── MESSAGES PANEL ── -->
  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="pending">Pendientes</button>
      <button class="tab" data-tab="all">Historial</button>
      <button class="btn-sort" id="sortBtn" title="Ordenar" style="display:none; margin-left:auto; margin-right:12px; background:none; border:none; color:var(--muted); cursor:pointer; font-family:var(--mono); font-size:11px;">↓ ID</button>
    </div>
    <div class="panel-header" style="border-top: none;">
      <span id="listLabel">Mensajes pendientes</span>
      <span class="count" id="msgCount">0</span>
    </div>
    <div class="panel-body" style="padding: 12px;">
      <div id="msgList" class="msg-list">
        <div class="loading">cargando...</div>
      </div>
    </div>
  </div>

</main>

<!-- Toast -->
<div id="toast"></div>

<script>
  const API = '';  // misma origen, sin prefijo adicional
  let currentTab = 'pending';
  let historyExpanded = false;

  // ── HEALTH CHECK ──
  async function checkStatus() {
    try {
      const r = await fetch(`${API}/health`);
      const d = await r.json();
      const dot  = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (d.whatsappReady) {
        dot.className = 'status-dot online';
        text.textContent = 'whatsapp conectado';
      } else {
        dot.className = 'status-dot offline';
        text.textContent = 'whatsapp desconectado';
      }
    } catch {
      document.getElementById('statusDot').className = 'status-dot offline';
      document.getElementById('statusText').textContent = 'servidor caído';
    }
  }

  // ── CARGAR MENSAJES ──
  async function loadMessages() {
    const list = document.getElementById('msgList');
    
    list.innerHTML = '<div class="loading">cargando...</div>';

    try {
      const endpoint = currentTab === 'pending'
        ? '/api/messages/pending'
        : '/api/messages';
      const r = await fetch(`${API}${endpoint}`);
      const d = await r.json();

      // Sort by ID
      const sorted = [...d.messages].sort((a, b) =>
        sortOrder === 'desc' ? b.id - a.id : a.id - b.id
      );
      const total = sorted.length;
      const visible = currentTab === 'all' && !historyExpanded
        ? sorted.slice(0, 8)
        : sorted;

      document.getElementById('msgCount').textContent = d.count;
      document.getElementById('listLabel').textContent =
        currentTab === 'pending'
          ? 'Mensajes pendientes'
          : (historyExpanded ? 'Historial completo' : 'Historial reciente');

      if (total === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">${currentTab === 'pending' ? '📭' : '📋'}</div>
            ${currentTab === 'pending' ? 'Sin mensajes pendientes' : 'Sin mensajes registrados'}
          </div>`;
        return;
      }

      list.innerHTML = visible.map(m => `
        <div class="msg-item" id="msg-${m.id}">
          <div>
            <div class="msg-phone">+${m.phone}</div>
            <div class="msg-text">${escapeHtml(m.message)}</div>
            <div class="msg-meta">
              <span class="badge badge-${m.status}">${m.status}</span>
              <span>🕐 ${formatDate(m.scheduled_at)}</span>
              <span class="msg-id">#${m.id}</span>
            </div>
          </div>
          ${m.status === 'pending' ? `
            <button
              class="btn btn-danger"
              onclick="deleteMessage(${m.id})"
              title="Cancelar mensaje"
            >✕</button>
          ` : ''}
        </div>
      `).join('') + (
        currentTab === 'all' && !historyExpanded && total > 8
          ? `<button class="load-more" id="loadMoreBtn">Ver más (${total - 8} restantes)</button>`
          : ''
      );

      const loadMoreBtn = document.getElementById('loadMoreBtn');
      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', () => {
          historyExpanded = true;
          loadMessages();
        });
      }

    } catch (e) {
      list.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>Error al cargar mensajes</div>';
    }
  }

  // ── PROGRAMAR MENSAJE ──
  // ── CHAR COUNTER ──
  document.getElementById('message').addEventListener('input', () => {
    const len = document.getElementById('message').value.length;
    const counter = document.getElementById('charCount');
    counter.textContent = `${len} / 4000 caracteres`;
    counter.className = 'hint' + (len > 3800 ? ' danger' : len > 3500 ? ' warning' : '');
  });

  // ── FILE INPUT ──
  document.getElementById('attachment').addEventListener('change', () => {
    const file = document.getElementById('attachment').files[0];
    const label = document.getElementById('fileLabel');

    if (file) {
      // Validate file size client-side
      if (file.size > 16 * 1024 * 1024) {
        showToast('El archivo supera el límite de 16MB', 'error');
        document.getElementById('attachment').value = '';
        label.textContent = 'Seleccionar imagen o documento...';
        label.classList.remove('selected');
        return;
      }
      label.textContent = file.name;
      label.classList.add('selected');
    } else {
      label.textContent = 'Seleccionar imagen o documento...';
      label.classList.remove('selected');
    }
  });

  document.getElementById('scheduleForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const phone       = document.getElementById('phone').value.trim().replace(/[\s+\-]/g, '');
    const message     = document.getElementById('message').value.trim();
    const scheduledAt = document.getElementById('scheduledAt').value;
    const file        = document.getElementById('attachment').files[0];
    const btn         = document.getElementById('submitBtn');

    // Client-side validations
    if (!phone || !message || !scheduledAt) {
      showToast('Completá todos los campos', 'error');
      return;
    }
    if (!/^\d{10,15}$/.test(phone) || phone.startsWith('0')) {
      showToast('Número inválido — incluí el prefijo internacional (ej: 549 para Argentina)', 'error');
      document.getElementById('phoneHint').style.display = 'block';
      return;
    }
    if (message.length > 4000) {
      showToast('El mensaje no puede superar los 4000 caracteres', 'error');
      return;
    }
    if (file && file.size > 16 * 1024 * 1024) {
      showToast('El archivo supera el límite de 16MB', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Programando...';

    try {
      const formData = new FormData();
      formData.append('phone', phone);
      formData.append('message', message);
      formData.append('scheduledAt', new Date(scheduledAt).toISOString());
      if (file) formData.append('attachment', file);

      const r = await fetch(`${API}/api/messages`, {
        method: 'POST',
        body: formData,
      });
      const d = await r.json();

      if (!r.ok) {
        const errMsg = d.errors ? d.errors.join(' / ') : (d.error || 'Error desconocido');
        showToast(errMsg, 'error');
        return;
      }

      showToast(`✓ Mensaje #${d.message.id} programado`);
      document.getElementById('scheduleForm').reset();
      document.getElementById('fileLabel').textContent = 'Seleccionar imagen o documento...';
      document.getElementById('fileLabel').classList.remove('selected');
      document.getElementById('charCount').textContent = '0 / 4000 caracteres';
      document.getElementById('charCount').className = 'hint';
      setTab('pending');

    } catch {
      showToast('No se pudo conectar al servidor', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Programar envío';
    }
  });

  // ── PHONE PREFIX WARNING ──
  document.getElementById('phone').addEventListener('input', () => {
    const phone = document.getElementById('phone').value.trim().replace(/[\s+\-]/g, '');
    const hint = document.getElementById('phoneHint');
    // Warning if number looks local (less than 10 digits or starts with 0)
    if (phone.length > 0 && (phone.startsWith('0') || (phone.length < 10 && phone.length > 0))) {
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }
  });

  // ── SORT ──
  let sortOrder = 'desc';

  document.getElementById('sortBtn').addEventListener('click', () => {
    sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
    document.getElementById('sortBtn').textContent = sortOrder === 'desc' ? '↓ ID' : '↑ ID';
    loadMessages();
  });
  
  // ── ELIMINAR MENSAJE ──
  async function deleteMessage(id) {
    if (!confirm(`¿Cancelar el mensaje #${id}?`)) return;
    try {
      const r = await fetch(`${API}/api/messages/${id}`, { method: 'DELETE' });
      const d = await r.json();
      if (!r.ok) { showToast(d.error || 'Error al cancelar', 'error'); return; }
      showToast(`✓ Mensaje #${id} cancelado`);
      // Eliminar el item del DOM sin recargar toda la lista
      const el = document.getElementById(`msg-${id}`);
      if (el) el.remove();
      // Actualizar contador
      const count = document.getElementById('msgCount');
      count.textContent = Math.max(0, parseInt(count.textContent) - 1);
    } catch {
      showToast('Error al cancelar el mensaje', 'error');
    }
  }

  // ── TABS ──
  function setTab(tab) {
    currentTab = tab;
    historyExpanded = false;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });
    document.getElementById('sortBtn').style.display = tab === 'all' ? 'block' : 'none';
    loadMessages();
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => setTab(t.dataset.tab));
  });

  // ── TOAST ──
  let toastTimer;
  function showToast(msg, type = 'ok') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `show${type === 'error' ? ' error' : ''}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.className = '', 3000);
  }

  // ── UTILS ──
  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  // Setear mínimo del datetime-local a ahora
  function setMinDate() {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('scheduledAt').min = now.toISOString().slice(0,16);
  }
  // ── BUSCADOR DE CONTACTOS ──
  let allContacts = [];

  async function loadContacts() {
    try {
      const r = await fetch('/api/contacts');
      const d = await r.json();
      if (d.ok) allContacts = d.contacts;
    } catch {
      allContacts = [];
    }
  }

  function renderSuggestions(query) {
    const box = document.getElementById('suggestions');
    const clear = document.getElementById('searchClear');

    if (!query) {
      box.classList.remove('open');
      clear.style.display = 'none';
      return;
    }

    clear.style.display = 'block';
    const q = query.toLowerCase();
    const matches = allContacts.filter(c =>
      c.name.toLowerCase().includes(q) || c.phone.includes(q)
    ).slice(0, 8);

    if (matches.length === 0) {
      box.innerHTML = '<div class="suggestions-empty">Sin resultados</div>';
    } else {
      box.innerHTML = matches.map(c => `
        <div class="suggestion-item" data-phone="${c.phone}">
          <span class="suggestion-name">${escapeHtml(c.name)}</span>
          <span class="suggestion-phone">+${c.phone}</span>
        </div>
      `).join('');

      box.querySelectorAll('.suggestion-item').forEach(el => {
        el.addEventListener('click', () => {
          document.getElementById('phone').value = el.dataset.phone;
          document.getElementById('contactSearch').value = el.querySelector('.suggestion-name').textContent;
          box.classList.remove('open');
          document.getElementById('searchClear').style.display = 'block';
        });
      });
    }

    box.classList.add('open');
  }

  document.getElementById('contactSearch').addEventListener('input', (e) => {
    renderSuggestions(e.target.value.trim());
  });

  document.getElementById('searchClear').addEventListener('click', () => {
    document.getElementById('contactSearch').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('suggestions').classList.remove('open');
    document.getElementById('searchClear').style.display = 'none';
  });

  // Cerrar sugerencias al hacer clic fuera
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrapper')) {
      document.getElementById('suggestions').classList.remove('open');
    }
  });

  // ── INIT ──
  setMinDate();
  checkStatus();
  loadMessages();
  loadContacts();

  // Refresco automático cada 30 segundos
  setInterval(() => {
    checkStatus();
    loadMessages();
  }, 30000);

  // ── SSE: notificaciones en tiempo real ──
function initSSE() {
  const evtSource = new EventSource('/api/messages/events');

  evtSource.onmessage = (e) => {
    const data = JSON.parse(e.data);

    if (data.type === 'sent') {
      showToast(`✓ Mensaje #${data.id} enviado a +${data.phone}`);
      // Recargar lista para reflejar el nuevo estado
      loadMessages();
    }

    if (data.type === 'failed') {
      showToast(`✗ Mensaje #${data.id} falló: ${data.error}`, 'error');
      loadMessages();
    }
  };

  evtSource.onerror = () => {
    // Reconexión automática — el navegador lo maneja solo
  };
}

// Llamar en el init
initSSE();
</script>
</body>
</html>
